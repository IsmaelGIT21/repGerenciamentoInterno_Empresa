<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title
        th:text="${apolice.id == null ? 'Nova Apólice | Olinda Hotel & Eventos' : 'Editar Apólice | Olinda Hotel & Eventos'}">
        Apólice | Olinda Hotel & Eventos
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body class="bg-[#f7f5ef] text-gray-800" style="font-family: 'Plus Jakarta Sans', sans-serif;">

    <div class="max-w-3xl mx-auto px-6 py-10">

        <div class="mb-8">

            <p class="text-sm uppercase tracking-widest text-[#a58b50] font-semibold">
                Olinda Hotel & Eventos
            </p>

            <h1 class="text-4xl text-[#244638] mt-2" style="font-family: 'Cormorant Garamond', serif;"
                th:text="${apolice.id == null} ? 'Nova apólice' : 'Editar apólice'">
            </h1>

            <p class="text-gray-500 mt-1">
                Preencha as informações do seguro e do item segurado.
            </p>

        </div>

        <div th:if="${erro}" class="bg-red-100 border border-red-300 text-red-800 px-4 py-3 rounded-lg mb-5"
            th:text="${erro}">
        </div>

        <form th:action="${acaoFormulario}" th:object="${apolice}" method="post"
            class="bg-white rounded-xl shadow-sm border border-gray-200 p-7 space-y-7">

            <!-- IDENTIFICAÇÃO -->
            <div>

                <h2 class="text-lg font-semibold text-[#244638] mb-4">
                    Identificação do item segurado
                </h2>

                <div class="mb-5">

                    <label for="descricao" class="block font-semibold text-gray-700 mb-2">
                        Descrição <span class="text-[#a58b50]">*</span>
                    </label>

                    <input type="text" id="descricao" th:field="*{descricao}" required maxlength="255"
                        placeholder="Ex.: Veículo, imóvel, equipamento..."
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div>

                        <label for="anoModelo" class="block font-semibold text-gray-700 mb-2">
                            Ano / Modelo
                        </label>

                        <input type="text" id="anoModelo" th:field="*{anoModelo}" maxlength="50"
                            placeholder="Ex.: 2022/2023"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    </div>

                    <div>

                        <label for="identificador" class="block font-semibold text-gray-700 mb-2">
                            Placa / Identificador
                        </label>

                        <input type="text" id="identificador" th:field="*{identificador}" maxlength="100"
                            placeholder="Ex.: ABC1D23"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    </div>

                </div>

            </div>

            <!-- DADOS DO SEGURO -->
            <div class="pt-5 border-t border-gray-100">

                <h2 class="text-lg font-semibold text-[#244638] mb-4">
                    Dados do seguro
                </h2>

                <div class="mb-5">

                    <label for="numeroApolice" class="block font-semibold text-gray-700 mb-2">
                        Número da Apólice / Proposta
                    </label>

                    <input type="text" id="numeroApolice" th:field="*{numeroApolice}" maxlength="100"
                        placeholder="Número da apólice ou proposta"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div>

                        <label for="seguradora" class="block font-semibold text-gray-700 mb-2">
                            Seguradora
                        </label>

                        <input type="text" id="seguradora" th:field="*{seguradora}" maxlength="150"
                            placeholder="Nome da seguradora"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    </div>

                    <div>

                        <label for="corretor" class="block font-semibold text-gray-700 mb-2">
                            Corretor
                        </label>

                        <input type="text" id="corretor" th:field="*{corretor}" maxlength="150"
                            placeholder="Nome do corretor"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    </div>

                </div>

            </div>

            <!-- VIGÊNCIA -->
            <div class="pt-5 border-t border-gray-100">

                <h2 class="text-lg font-semibold text-[#244638] mb-4">
                    Vigência do seguro
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div>

                        <label for="dataInicio" class="block font-semibold text-gray-700 mb-2">
                            Data de Início
                        </label>

                        <input type="date" id="dataInicio" name="dataInicio"
                            th:value="${apolice.dataInicio != null ? #temporals.format(apolice.dataInicio, 'yyyy-MM-dd') : ''}"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    </div>

                    <div>

                        <label for="dataVencimento" class="block font-semibold text-gray-700 mb-2">
                            Data de Vencimento
                        </label>

                        <input type="date" id="dataVencimento" name="dataVencimento"
                            th:value="${apolice.dataVencimento != null ? #temporals.format(apolice.dataVencimento, 'yyyy-MM-dd') : ''}"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    </div>

                </div>

            </div>

            <!-- VALORES -->
            <div class="pt-5 border-t border-gray-100">

                <h2 class="text-lg font-semibold text-[#244638] mb-4">
                    Valores e condições
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div>

                        <label for="valorPremio" class="block font-semibold text-gray-700 mb-2">
                            Valor do Prêmio (R$)
                        </label>

                        <input type="number" id="valorPremio" th:field="*{valorPremio}" min="0" step="0.01"
                            placeholder="0.00"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    </div>

                    <div>

                        <label for="valorFranquia" class="block font-semibold text-gray-700 mb-2">
                            Valor da Franquia (R$)
                        </label>

                        <input type="number" id="valorFranquia" th:field="*{valorFranquia}" min="0" step="0.01"
                            placeholder="0.00"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    </div>

                    <div>

                        <label for="lmi" class="block font-semibold text-gray-700 mb-2">
                            LMI (R$)
                        </label>

                        <input type="number" id="lmi" th:field="*{lmi}" min="0" step="0.01" placeholder="0.00"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    </div>

                    <div>

                        <label for="comissao" class="block font-semibold text-gray-700 mb-2">
                            Comissão (R$)
                        </label>

                        <input type="number" id="comissao" th:field="*{comissao}" min="0" step="0.01" placeholder="0.00"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    </div>

                </div>

                <div class="mt-5">

                    <label for="parcelas" class="block font-semibold text-gray-700 mb-2">
                        Quantidade de Parcelas
                    </label>

                    <input type="number" id="parcelas" th:field="*{parcelas}" min="1" step="1" placeholder="Ex.: 12"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">

                </div>

            </div>

            <!-- LOCAL -->
            <div class="pt-5 border-t border-gray-100">

                <h2 class="text-lg font-semibold text-[#244638] mb-4">
                    Vinculação ao local
                </h2>

                <label for="local" class="block font-semibold text-gray-700 mb-2">
                    Local / Unidade <span class="text-[#a58b50]">*</span>
                </label>

                <select id="local" th:field="*{local.id}" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    <option value="">
                        Selecione um local
                    </option>

                    <option th:each="local : ${locais}" th:value="${local.id}" th:text="${local.nome}">
                    </option>

                </select>

                <p class="text-xs text-gray-500 mt-2">
                    Toda apólice deve estar vinculada a um local cadastrado.
                </p>

            </div>

            <!-- BOTÕES -->
            <div class="flex justify-end gap-3 pt-5 border-t border-gray-100">

                <a th:href="@{/apolices}"
                    class="px-5 py-3 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors">
                    Cancelar
                </a>

                <button type="submit"
                    class="px-5 py-3 rounded-lg bg-[#244638] hover:bg-[#193629] text-white font-semibold transition-colors">

                    Salvar apólice

                </button>

            </div>

        </form>

    </div>

</body>

</html>
