<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar conta</title>
</head>
<body>
    <h1>Cadastrar conta</h1>

    <form th:action="@{/contas}" th:object="${conta}" method="post">
        <div>
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" th:field="*{descricao}" required>
        </div>

        <div>
            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" th:field="*{valor}"
                   min="0.01" step="0.01" required>
        </div>

        <div>
            <label for="dataVencimento">Data de vencimento:</label>
            <input type="date" id="dataVencimento"
                   th:field="*{dataVencimento}" required>
        </div>

        <div>
            <label for="local">Local:</label>
            <select id="local" th:field="*{local.id}" required>
                <option value="">Selecione um local</option>
                <option th:each="local : ${locais}"
                        th:value="${local.id}"
                        th:text="${local.nome}">
                </option>
            </select>
        </div>

        <div>
            <label for="observacoes">Observações:</label>
            <textarea id="observacoes" th:field="*{observacoes}"></textarea>
        </div>

        <button type="submit">Salvar conta</button>
    </form>

    <p><a th:href="@{/contas}">Voltar para a lista</a></p>
</body>
</html>
