<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title
        th:text="${conta.id == null ? 'Nova Conta | Olinda Hotel & Eventos' : 'Editar Conta | Olinda Hotel & Eventos'}">
        Conta | Olinda Hotel & Eventos
    </title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="bg-[#f7f5ef] text-gray-800" style="font-family: 'Plus Jakarta Sans', sans-serif;">

    <div class="max-w-2xl mx-auto px-6 py-10">

        <!-- Cabeçalho -->
        <div class="mb-8">
            <p class="text-sm uppercase tracking-widest text-[#a58b50] font-semibold">
                Olinda Hotel & Eventos
            </p>

            <h1 class="text-4xl text-[#244638] mt-2" style="font-family: 'Cormorant Garamond', serif;"
                th:text="${conta.id == null} ? 'Nova conta' : 'Editar conta'">
            </h1>

            <p class="text-gray-500 mt-1">
                Preencha os detalhes da conta a pagar ou receber.
            </p>
        </div>

        <!-- Mensagem de Erro (se houver) -->
        <div th:if="${erro}" class="bg-red-100 border border-red-300 text-red-800 px-4 py-3 rounded-lg mb-5"
            th:text="${erro}">
        </div>

        <!-- Formulário -->
        <form th:action="${acaoFormulario}" th:object="${conta}" method="post"
            class="bg-white rounded-xl shadow-sm border border-gray-200 p-7 space-y-6">

            <!-- Descrição -->
            <div>
                <label for="descricao" class="block font-semibold text-gray-700 mb-2">
                    Descrição <span class="text-[#a58b50]">*</span>
                </label>
                <input type="text" id="descricao" th:field="*{descricao}" required
                    placeholder="Ex.: Fornecimento de Hortifrúti - Evento"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">
            </div>
            <!-- Fornecedor -->
            <div>
                <label for="fornecedor" class="block font-semibold text-gray-700 mb-2">
                    Fornecedor
                </label>

                <select id="fornecedor" th:field="*{fornecedor.id}"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-[#244638]">

                    <option value="">Nenhum fornecedor selecionado</option>

                    <option th:each="fornecedor : ${fornecedores}" th:value="${fornecedor.id}"
                        th:text="${fornecedor.nome}">
                    </option>
                </select>
            </div>

            <!-- Linha 2: Valor e Vencimento -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Valor -->
                <div>
                    <label for="valor" class="block font-semibold text-gray-700 mb-2">
                        Valor (R$) <span class="text-[#a58b50]">*</span>
                    </label>
                    <div class="relative rounded-lg">
                        <span
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500 font-medium">
                            R$
                        </span>
                        <input type="number" id="valor" th:field="*{valor}" min="0.01" step="0.01" required
                            placeholder="0,00"
                            class="w-full border border-gray-300 rounded-lg pl-11 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">
                    </div>
                </div>

                <!-- Vencimento -->
                <div>
                    <label for="dataVencimento" class="block font-semibold text-gray-700 mb-2">
                        Data de Vencimento <span class="text-[#a58b50]">*</span>
                    </label>
                    <input type="date" id="dataVencimento" th:field="*{dataVencimento}" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#244638]">
                </div>
            </div>

            <!-- Linha 3: Local e Situação -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Local / Unidade -->
                <div>
                    <label for="local" class="block font-semibold text-gray-700 mb-2">
                        Local / Unidade <span class="text-[#a58b50]">*</span>
                    </label>
                    <select id="local" th:field="*{local.id}" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-[#244638]">
                        <option value="">Selecione um local</option>
                        <option th:each="local : ${locais}" th:value="${local.id}" th:text="${local.nome}">
                        </option>
                    </select>
                </div>

                <!-- Situação -->
                <div>
                    <label for="status" class="block font-semibold text-gray-700 mb-2">
                        Situação <span class="text-[#a58b50]">*</span>
                    </label>
                    <select id="status" th:field="*{status}" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-[#244638]">
                        <option value="PENDENTE">Pendente</option>
                        <option value="PAGA">Paga</option>
                    </select>
                </div>
            </div>

            <!-- Data do Pagamento (Condicional via JavaScript) -->
            <div id="campoDataPagamento" th:style="${conta.status == 'PAGA'} ? 'display: block' : 'display: none'"
                class="p-4 bg-[#f7f5ef] border border-gray-200 rounded-lg">
                <label for="dataPagamento" class="block font-semibold text-gray-700 mb-2">
                    Data do Pagamento
                </label>
                <input type="date" id="dataPagamento" th:field="*{dataPagamento}"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-[#244638]">
            </div>

            <!-- Observações -->
            <div>
                <label for="observacoes" class="block font-semibold text-gray-700 mb-2">
                    Observações
                </label>
                <textarea id="observacoes" th:field="*{observacoes}" rows="3"
                    placeholder="Anotações adicionais ou detalhes da conta..."
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]"></textarea>
            </div>

            <!-- Botões de Ação -->
            <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                <a href="/contas"
                    class="px-5 py-3 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors">
                    Cancelar
                </a>

                <button type="submit"
                    class="px-5 py-3 rounded-lg bg-[#244638] hover:bg-[#193629] text-white font-semibold transition-colors">
                    Salvar conta
                </button>
            </div>

        </form>

    </div>

    <!-- Script nativo mantido sem dependências de ícones ou estilos extras -->
    <script>
        const statusConta = document.getElementById('status');
        const campoDataPagamento = document.getElementById('campoDataPagamento');
        const dataPagamento = document.getElementById('dataPagamento');

        function atualizarCampoDataPagamento() {
            const contaPaga = statusConta.value === 'PAGA';
            campoDataPagamento.style.display = contaPaga ? 'block' : 'none';

            if (!contaPaga) {
                dataPagamento.value = '';
            }
        }

        statusConta.addEventListener('change', atualizarCampoDataPagamento);
        atualizarCampoDataPagamento();
    </script>

</body>

</html>
