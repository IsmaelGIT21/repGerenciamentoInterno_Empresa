<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title
        th:text="${local.id == null ? 'Novo Local | Olinda Hotel & Eventos' : 'Editar Local | Olinda Hotel & Eventos'}">
        Local | Olinda Hotel & Eventos
    </title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="bg-[#f7f5ef] text-gray-800" style="font-family: 'Plus Jakarta Sans', sans-serif;">

    <div class="max-w-2xl mx-auto px-6 py-10">

        <!-- Cabeçalho da Página -->
        <div class="mb-8">
            <p class="text-sm uppercase tracking-widest text-[#a58b50] font-semibold">
                Olinda Hotel & Eventos
            </p>

            <h1 class="text-4xl text-[#244638] mt-2" style="font-family: 'Cormorant Garamond', serif;"
                th:text="${local.id == null} ? 'Novo local' : 'Editar local'">
            </h1>

            <p class="text-gray-500 mt-1">
                Informe os dados da unidade ou espaço físico.
            </p>
        </div>

        <!-- Mensagem de Erro (se houver) -->
        <div th:if="${erro}" class="bg-red-100 border border-red-300 text-red-800 px-4 py-3 rounded-lg mb-5"
            th:text="${erro}">
        </div>

        <!-- Formulário -->
        <form th:action="${acaoFormulario}" th:object="${local}" method="post"
            class="bg-white rounded-xl shadow-sm border border-gray-200 p-7 space-y-6">

            <!-- Nome do Local -->
            <div>
                <label for="nome" class="block font-semibold text-gray-700 mb-2">
                    Nome do local <span class="text-[#a58b50]">*</span>
                </label>
                <input type="text" id="nome" th:field="*{nome}" required
                    placeholder="Ex.: Salão Nobre, Escritório Central..."
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">
            </div>

            <!-- Tipo de Local -->
            <div>
                <label for="tipo" class="block font-semibold text-gray-700 mb-2">
                    Tipo de local <span class="text-[#a58b50]">*</span>
                </label>
                <select id="tipo" th:field="*{tipo}" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-[#244638]">
                    <option value="">Selecione um tipo</option>
                    <option value="ESCRITORIO">Escritório</option>
                    <option value="CASA">Casa</option>
                    <option value="CHACARA">Chácara</option>
                    <option value="APARTAMENTO">Apartamento</option>
                    <option value="OUTRO">Outro</option>
                </select>
            </div>

            <!-- Endereço -->
            <div>
                <label for="endereco" class="block font-semibold text-gray-700 mb-2">
                    Endereço
                </label>
                <input type="text" id="endereco" th:field="*{endereco}"
                    placeholder="Ex.: Av. Parigot de Souza, 1200 - Toledo, PR"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#244638]">
            </div>

            <!-- Botões de Ação -->
            <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                <a th:href="@{/locais}"
                    class="px-5 py-3 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors">
                    Cancelar
                </a>

                <button type="submit"
                    class="px-5 py-3 rounded-lg bg-[#244638] hover:bg-[#193629] text-white font-semibold transition-colors">
                    Salvar local
                </button>
            </div>

        </form>

    </div>

</body>

</html>
