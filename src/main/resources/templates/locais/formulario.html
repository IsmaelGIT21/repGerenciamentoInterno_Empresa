<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar local</title>
</head>
<body>
    <h1>Cadastrar local</h1>

    <form th:action="@{/locais}" th:object="${local}" method="post">
        <div>
            <label for="nome">Nome do local:</label>
            <input type="text" id="nome" th:field="*{nome}" required>
        </div>

        <div>
            <label for="tipo">Tipo de local:</label>
            <select id="tipo" th:field="*{tipo}" required>
                <option value="">Selecione</option>
                <option value="ESCRITORIO">Escritório</option>
                <option value="CASA">Casa</option>
                <option value="CHACARA">Chácara</option>
                <option value="APARTAMENTO">Apartamento</option>
                <option value="OUTRO">Outro</option>
            </select>
        </div>

        <div>
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" th:field="*{endereco}">
        </div>

        <button type="submit">Salvar local</button>
    </form>

    <p><a th:href="@{/locais}">Voltar para a lista</a></p>
</body>
</html>
