<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sperafico Incorporadora</title>

    <!-- 1. Primeiro carrega o CDN do Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. Depois carrega o seu ficheiro login.js para estender as configurações -->
    <script th:src="@{/js/login.js}"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body
    class="bg-[#f8f9fa] text-gray-800 min-h-screen flex items-center justify-center font-['Plus_Jakarta_Sans',sans-serif] px-4 py-12">

    <div class="max-w-md w-full space-y-6">

        <!-- CABEÇALHO / MONOGRAMA SPERAFICO -->
        <div class="text-center space-y-3">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-2xl border border-gold-500/50 bg-[#00205b] bg-brand-900 shadow-xl shadow-brand-900/20 group hover:scale-105 transition-all">
                <span class="font-['Cormorant_Garamond'] text-[#c2a15f] text-gold-400 font-bold text-4xl">S</span>
            </div>
            <div>
                <span class="text-[10px] tracking-[0.3em] text-[#8c733e] text-gold-600 uppercase font-bold block">
                    Sperafico Incorporadora
                </span>
                <h1
                    class="text-2xl sm:text-3xl font-bold text-[#00205b] text-brand-900 font-['Cormorant_Garamond'] mt-1">
                    Gestão Empresarial
                </h1>
            </div>
        </div>

        <!-- MENSAGEM DE ERRO -->
        <div th:if="${param.error}"
            class="bg-rose-50 border border-rose-200 text-rose-900 px-4 py-3 rounded-2xl text-xs font-semibold flex items-center gap-3 shadow-sm">
            <i class="fa-solid fa-circle-exclamation text-rose-600 text-base shrink-0"></i>
            <span>Usuário ou senha inválidos. Tente novamente.</span>
        </div>

        <!-- MENSAGEM DE LOGOUT -->
        <div th:if="${param.logout}"
            class="bg-emerald-50 border border-emerald-200 text-emerald-900 px-4 py-3 rounded-2xl text-xs font-semibold flex items-center gap-3 shadow-sm">
            <i class="fa-solid fa-circle-check text-emerald-600 text-base shrink-0"></i>
            <span>Você foi desconectado com sucesso.</span>
        </div>

        <!-- CARTÃO DO FORMULÁRIO DE LOGIN -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8 space-y-6">

            <div class="border-b border-gray-100 pb-4 text-center">
                <h2 class="text-base font-bold text-[#00205b] text-brand-900 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-lock text-[#c2a15f] text-gold-500 text-sm"></i>
                    Acesso ao Sistema
                </h2>
                <p class="text-xs text-gray-400 mt-1">Informe suas credenciais para continuar</p>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-5">

                <!-- Campo Usuário -->
                <div>
                    <label for="username" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">
                        Usuário <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative rounded-xl">
                        <span
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#c2a15f] text-gold-500 text-sm">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" name="username" required autocomplete="username"
                            placeholder="Digite seu usuário"
                            class="w-full border border-gray-200 rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-[#00205b] focus:border-[#00205b] focus:outline-none bg-gray-50/50">
                    </div>
                </div>

                <!-- Campo Senha -->
                <div>
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">
                        Senha <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative rounded-xl">
                        <span
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#c2a15f] text-gold-500 text-sm">
                            <i class="fa-solid fa-key"></i>
                        </span>

                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            placeholder="Digite sua senha"
                            class="w-full border border-gray-200 rounded-xl pl-10 pr-20 py-3 text-sm focus:ring-2 focus:ring-[#00205b] focus:border-[#00205b] focus:outline-none bg-gray-50/50">

                        <button type="button" id="togglePassword"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-xs font-bold text-gray-500 hover:text-[#00205b] transition-colors">
                            Mostrar
                        </button>
                    </div>
                </div>

                <!-- Botão Entrar no Sistema -->
                <div class="pt-2">
                    <button type="submit"
                        class="w-full py-3.5 px-6 rounded-xl bg-[#00205b] hover:bg-[#1b365d] bg-brand-900 hover:bg-brand-800 text-white font-bold text-xs uppercase tracking-wider transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Entrar no Sistema</span>
                    </button>
                </div>

            </form>

        </div>

        <!-- RODAPÉ DA TELA DE LOGIN -->
        <p class="text-center text-xs text-gray-400">
            &copy; Sperafico Incorporadora &bull; Todos os direitos reservados
        </p>

    </div>

</body>

</html>
